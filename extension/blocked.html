<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentiGuard — Dangerous Site Blocked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: #070a0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Grid background pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    .bg-glow {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.25) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 640px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 0 60px rgba(244, 63, 94, 0.15), 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .shield-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.3);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(244, 63, 94, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 45px rgba(244, 63, 94, 0.5); }
    }

    .shield-icon {
      width: 38px;
      height: 38px;
      color: #f43f5e;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fda4af;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    p.lead {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* Target URL Card */
    .url-card {
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }

    .url-text {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .score-badge {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(244, 63, 94, 0.2);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
      flex-shrink: 0;
    }

    /* Risk factors list */
    .risks-box {
      background: rgba(244, 63, 94, 0.05);
      border: 1px solid rgba(244, 63, 94, 0.15);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 28px;
      text-align: left;
    }

    .risks-box h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fda4af;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .risks-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .risk-item {
      font-size: 12px;
      line-height: 1.5;
      color: #fecdd3;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .risk-item::before {
      content: "•";
      color: #f43f5e;
      font-weight: bold;
      font-size: 16px;
      line-height: 12px;
    }

    /* Action buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-safety {
      width: 100%;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(225, 29, 72, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-safety:hover {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      transform: translateY(-1px);
      box-shadow: 0 0 35px rgba(225, 29, 72, 0.6);
    }

    .secondary-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.8);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-bypass {
      background: transparent;
      color: #64748b;
      border: none;
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .btn-bypass:hover {
      color: #f43f5e;
    }

    /* Dispute modal / toast */
    #feedbackMsg {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container">
    <div class="shield-badge">
      <svg class="shield-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM12 8v4m0 4h.01"></path>
      </svg>
    </div>

    <div class="tag">SentiGuard Active Shield</div>
    <h1>Dangerous Website Intercepted</h1>
    <p class="lead">
      SentiGuard blocked this untrusted URL before it could load to protect your credentials, personal identity, and computer from phishing threats.
    </p>

    <div class="url-card">
      <span class="url-text" id="targetUrl">Loading destination...</span>
      <span class="score-badge" id="scoreBadge">Risk: Critical</span>
    </div>

    <div class="risks-box" id="risksBox">
      <h3>
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        Identified Threat Vectors
      </h3>
      <ul class="risks-list" id="risksList"></ul>
    </div>

    <div class="actions">
      <button class="btn-safety" id="btnBack">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Go Back to Safety (Recommended)
      </button>

      <div class="secondary-row">
        <button class="btn-secondary" id="btnWhitelist">
          Trust & Whitelist Domain
        </button>
        <button class="btn-secondary" id="btnReport">
          Report False Alarm
        </button>
      </div>

      <button class="btn-bypass" id="btnProceed">
        Proceed anyway to unsafe site (Not recommended)
      </button>
    </div>

    <div id="feedbackMsg"></div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
