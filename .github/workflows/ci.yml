name: SentiGuard CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Tests & ML Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Code Hygiene & Security Linting (Ruff)
        run: |
          ruff check backend/ test_runner.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Run ML Benchmark Accuracy Gate (>= 95%)
        run: |
          python test_runner.py 0.95

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Node Dependencies
        run: |
          npm --prefix frontend ci

      - name: Verify Frontend Production Build
        run: |
          npm --prefix frontend run build
